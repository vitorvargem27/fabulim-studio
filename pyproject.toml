[project]
name = "fabulim-studio"
version = "0.0.0"
description = "Fabulim Studio: estúdio local de vídeos infantis com IA (backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Acentos e sinais em português são intencionais; o ruff os acha "ambíguos".
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # E501: o formatador cuida do código; textos em português ficam longos

[tool.ruff.lint.per-file-ignores]
"scripts/perfil.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend/app", "scripts/perfil.py"]

# bibliotecas de IA que só os medidores (processos à parte) importam e que não trazem tipos
[[tool.mypy.overrides]]
module = ["kokoro_onnx", "onnxruntime", "soundfile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers -m 'not hw'"
markers = ["hw: suíte de hardware real (lenta, usa esta máquina de verdade); rode com `pytest -m hw` ou `testar --hw`"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
